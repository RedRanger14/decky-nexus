name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Linux AND Windows, because the checks disagree between them and the
    # disagreement is always news. Two real cases from one PR review
    # (2026-09-11): a path assertion that built "x64\plugins" passed on the
    # contributor's Linux box and failed on the maintainer's laptop, and the
    # game-config snapshot compared values holding newlines, so CRLF against
    # LF reported a game as changed. A Linux-only CI cannot see either, and
    # both reached a human instead.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # decky-loader era; tests are stdlib-only

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # pyflakes is the only non-stdlib thing the checks need. It was missing,
      # so `pnpm run check` failed here on every push while passing locally.
      - name: Install lint tooling
        run: python -m pip install --quiet pyflakes

      # The same command used locally, rather than a subset of it. A CI that
      # runs different checks from the ones a developer runs will disagree
      # with them, and the CI is the one nobody trusts afterwards.
      - name: Check
        run: pnpm run check

      - name: Build bundle
        run: pnpm run build
